<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback | Vinegar Food</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- HEADER -->
<div class="container text-center my-5">
    <h1 class="fw-bold text-white">Feedback</h1>
    <p class="text-light">Your feedback helps us improve</p>
</div>

<!-- FEEDBACK FORM -->
<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="p-4 shadow rounded formpage">

                <h4 class="mb-3 text-center">Share Your Experience</h4>

                <form id="feedbackForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Your Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name" required>
                        </div>

                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Rate Us</label>
                        <select class="form-select" required>
                            <option value="">Choose rating</option>
                            <option>⭐ Excellent</option>
                            <option>⭐⭐ Good</option>
                            <option>⭐⭐⭐ Average</option>
                            <option>⭐⭐⭐⭐ Poor</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Your Feedback</label>
                        <textarea class="form-control" rows="4" placeholder="Write your feedback..." required></textarea>
                    </div>

                    <div class="text-center">
                        <button type="submit" class="btn bannerbtn px-4">
                            Submit Feedback
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById("feedbackForm").onsubmit = function(e){
        e.preventDefault(); // page reload band
        alert("Your feedback has been submitted");
        this.reset(); // form clear
    };
</script>




<!-- FOOTER -->
<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
