<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Vinegar Food</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
</head>

<body>

<!-- NAVBAR -->
<div id="navbar"></div>

<!-- PAGE HEADER -->
<div class="container text-center my-5">
    <h1 class="fw-bold text-white" >Contact Us</h1>
    <p class="text-light">Feel free to reach us anytime</p>
</div>

<!-- CONTACT SECTION -->
<div class="container mb-5">
    <div class="row g-4">

        <!-- LEFT SIDE : CONTACT INFO -->
        <div class="col-md-4">
            <div class="p-4 shadow rounded h-100 formpage">
                <h4 class="mb-3">Our Address</h4>
                <p>📍 72 Vinegar Street,<br>Food City, Pakistan</p>
                <p>📞 +91 98765 43210</p>
                <p>✉️ info@vinegarfood.com</p>
                <p>⏰ Mon – Sun : 9 AM – 11 PM</p>
            </div>
        </div>

        <!-- RIGHT SIDE : FORM -->
        <div class="col-md-8">
            <div class="p-4 shadow rounded formpage">
                <h4 class="mb-3">Send Us a Message</h4>

                <form id="contactForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <input type="text" class="form-control" placeholder="Your Name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <input type="email" class="form-control" placeholder="Your Email" required>
                        </div>
                         <div class="col-md-6 mb-3">
                            <input type="number" class="form-control" placeholder="Your Phone" required>
                        </div>
                         <div class="col-md-6 mb-3">
                            <input type="text" class="form-control" placeholder="Your Address" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <textarea class="form-control" rows="4" placeholder="Your Message" required></textarea>
                    </div>

                    <button class="btn bannerbtn px-4">Send Message</button>
                </form>
            </div>
        </div>

    </div>
</div>

<!-- MAP SECTION -->
<div class="container-fluid px-0 mb-5 text-center">
   <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3619.3030981450906!2d67.1520719!3d24.887640899999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33999ec8ecc87%3A0xda9cc5004c86e53f!2sMETRO%20Stargate%20Store%2C%20Karachi!5e0!3m2!1sen!2s!4v1766379437439!5m2!1sen!2s" width="100%" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>

<script>
    document.getElementById("contactForm").onsubmit = function(e){
        e.preventDefault();   // page reload band
        alert("Your message has been submitted");
        this.reset();         // form clear
    };
</script>









<!-- FOOTER -->
<div id="footer"></div>

<script src="navbar.js"></script>
<script src="footer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
